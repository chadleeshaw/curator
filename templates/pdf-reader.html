<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Reader - Curator</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪙</text></svg>"
    />
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/themes.css" />
    <link rel="stylesheet" href="/static/css/reader.css" />
    <script type="module" src="/static/js/pdf-reader.js?v=1769024098"></script>
  </head>
  <body>
    <!-- Header -->
    <div class="reader-header">
      <h1 class="reader-title" id="pdf-title">Loading...</h1>
      <div class="header-actions">
        <button class="nav-btn" id="header-prev-btn" onclick="pdfReader.previousPage()">←</button>
        <button class="btn" id="back-btn" onclick="pdfReader.goBackToPeriodical()">
          ← Back to Periodical
        </button>
        <button class="nav-btn" id="header-next-btn" onclick="pdfReader.nextPage()">→</button>
      </div>
    </div>

    <!-- Main Container -->
    <div class="reader-container">
      <!-- Sidebar -->
      <div class="sidebar" id="sidebar">
        <div class="sidebar-header">Pages</div>
        <div class="page-list" id="page-list">
          <div class="loading">
            <div style="text-align: center">
              <div class="spinner"></div>
              <div>Loading pages...</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Content Area -->
      <div class="content-area">
        <div class="content-header">
          <div class="page-title-display" id="current-page-title">Select a page</div>
          <div class="fit-controls">
            <span class="fit-controls-label">Fit:</span>
            <button
              class="fit-btn"
              data-mode="fit-width"
              onclick="pdfReader.setFitMode('fit-width')"
            >
              Width
            </button>
            <button
              class="fit-btn active"
              data-mode="fit-height"
              onclick="pdfReader.setFitMode('fit-height')"
            >
              Height
            </button>
            <button class="fit-btn" data-mode="original" onclick="pdfReader.setFitMode('original')">
              Original
            </button>
          </div>
          <div class="zoom-controls">
            <span class="fit-controls-label">Zoom:</span>
            <button class="fit-btn" onclick="pdfReader.adjustZoom(-10)" title="Zoom out (-)">
              −
            </button>
            <span id="zoom-level" style="min-width: 45px; text-align: center; font-weight: 500">
              100%
            </span>
            <button class="fit-btn" onclick="pdfReader.adjustZoom(10)" title="Zoom in (+)">
              +
            </button>
            <button class="fit-btn" onclick="pdfReader.resetZoom()" title="Reset zoom (0)">
              Reset
            </button>
          </div>
          <div class="view-controls">
            <button
              class="fit-btn"
              id="spread-btn"
              onclick="pdfReader.toggleSpreadMode()"
              title="Two-page spread mode (S)"
            >
              📄
            </button>
            <button
              class="fit-btn"
              id="fullscreen-btn"
              onclick="pdfReader.toggleFullscreen()"
              title="Fullscreen (F)"
            >
              ⛶
            </button>
          </div>
          <div class="nav-buttons">
            <button class="nav-btn" id="prev-btn" onclick="pdfReader.previousPage()">
              ← Previous
            </button>
            <button class="nav-btn" id="next-btn" onclick="pdfReader.nextPage()">Next →</button>
          </div>
        </div>
        <div class="page-content" id="page-content">
          <div class="loading">
            <div style="text-align: center">
              <div class="spinner"></div>
              <div>Loading content...</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile Overlay -->
    <div class="mobile-overlay" id="mobile-overlay" onclick="toggleSidebar()"></div>
  </body>
</html>
