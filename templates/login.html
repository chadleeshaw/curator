<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Login to Curator - Search, download, and organize your periodicals"
    />
    <meta name="theme-color" content="#5c32ba" />
    <meta name="robots" content="noindex, nofollow" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Curator - Login</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%237b68ee%22 stroke-width=%221.75%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z%22/><path d=%22M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z%22/></svg>"
    />
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/themes.css" />
    <link rel="stylesheet" href="/static/css/login.css" />
  </head>
  <body>
    <!-- SVG sprite for icon reuse -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
      <symbol
        id="icon-eye"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol
        id="icon-eye-off"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
        <line x1="1" y1="1" x2="23" y2="23" />
      </symbol>
    </svg>
    <main class="login-main" role="main">
      <div class="login-container">
        <header class="login-header">
          <h1>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="var(--primary-color)"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
            </svg>
            Curator
          </h1>
          <p>Search, download, organize, and read your periodicals</p>
        </header>

        <div id="errorMessage" class="error-message" role="alert" aria-live="assertive"></div>
        <div id="successMessage" class="success-message" role="status" aria-live="polite"></div>

        <!-- Login Mode -->
        <section id="loginMode" aria-labelledby="login-title">
          <h2 id="login-title" class="sr-only">Login Form</h2>
          <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
            <div class="form-group">
              <label for="loginUsername">Username</label>
              <input
                type="text"
                id="loginUsername"
                name="username"
                required
                aria-required="true"
                autocomplete="username"
              />
            </div>
            <div class="form-group form-group-password">
              <label for="loginPassword">Password</label>
              <div class="input-wrapper">
                <input
                  type="password"
                  id="loginPassword"
                  name="password"
                  required
                  aria-required="true"
                  autocomplete="current-password"
                />
                <button
                  type="button"
                  class="toggle-password"
                  onclick="togglePasswordVisibility('loginPassword')"
                  aria-label="Toggle password visibility"
                  aria-pressed="false"
                >
                  <svg aria-hidden="true" width="18" height="18"><use href="#icon-eye" /></svg>
                </button>
              </div>
            </div>
            <button type="submit" class="submit-btn" id="loginBtn">Sign In</button>
          </form>
        </section>

        <!-- Setup Mode -->
        <section id="setupMode" class="hidden" aria-labelledby="setup-title">
          <h2 id="setup-title" class="sr-only">Setup Form</h2>
          <form id="setupForm" onsubmit="handleSetup(event)" novalidate>
            <p class="setup-instructions">Create your admin account to get started</p>
            <div class="form-group">
              <label for="setupUsername">Username</label>
              <input
                type="text"
                id="setupUsername"
                name="username"
                required
                aria-required="true"
                minlength="3"
                autocomplete="username"
              />
            </div>
            <div class="form-group form-group-password">
              <label for="setupPassword">Password</label>
              <div class="input-wrapper">
                <input
                  type="password"
                  id="setupPassword"
                  name="password"
                  required
                  aria-required="true"
                  minlength="8"
                  autocomplete="new-password"
                />
                <button
                  type="button"
                  class="toggle-password"
                  onclick="togglePasswordVisibility('setupPassword')"
                  aria-label="Toggle password visibility"
                  aria-pressed="false"
                >
                  <svg aria-hidden="true" width="18" height="18"><use href="#icon-eye" /></svg>
                </button>
              </div>
            </div>
            <div class="form-group form-group-password">
              <label for="setupPasswordConfirm">Confirm Password</label>
              <div class="input-wrapper">
                <input
                  type="password"
                  id="setupPasswordConfirm"
                  name="confirmPassword"
                  required
                  aria-required="true"
                  minlength="8"
                  autocomplete="new-password"
                />
                <button
                  type="button"
                  class="toggle-password"
                  onclick="togglePasswordVisibility('setupPasswordConfirm')"
                  aria-label="Toggle password visibility"
                  aria-pressed="false"
                >
                  <svg aria-hidden="true" width="18" height="18"><use href="#icon-eye" /></svg>
                </button>
              </div>
            </div>
            <button type="submit" class="submit-btn" id="setupBtn">Create Credentials</button>
          </form>
        </section>
      </div>
    </main>

    <script src="/static/js/login.js"></script>
  </body>
</html>
