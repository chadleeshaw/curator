<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>{{STACK_NAME}} - Curator</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%237b68ee%22 stroke-width=%221.75%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z%22/><path d=%22M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z%22/></svg>"
    />
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/themes.css" />
    <link rel="stylesheet" href="/static/css/layout.css" />
    <link rel="stylesheet" href="/static/css/components.css" />
    <link rel="stylesheet" href="/static/css/pages.css" />
    <link rel="stylesheet" href="/static/css/periodical.css" />
    <link rel="stylesheet" href="/static/css/stacks.css" />
  </head>
  <body class="detail-body">
    <!-- Breadcrumb (outside container for sticky positioning) -->
    <nav class="breadcrumb detail-breadcrumb">
      <a href="/#library">Library</a>
      <span class="separator">/</span>
      <span class="current">{{STACK_NAME}}</span>
    </nav>

    <div
      class="container detail-page"
      id="stack-container"
      data-slug="{{STACK_SLUG}}"
      data-members="{{MEMBERS_DATA}}"
    >
      <div class="stack-page-header collapsible-header">
        <div class="header-content-row">
          <div class="header-title-area">
            <h1 id="stack-title">
              <span class="header-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="28"
                  height="28"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="var(--primary-color)"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                  <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></svg></span
              >{{STACK_NAME}}
            </h1>
            <p id="stack-description" class="stack-page-subtitle">{{STACK_DESCRIPTION}}</p>
            <p id="stack-sort-subtitle" class="stack-page-subtitle stack-sort-subtitle"></p>
            <div class="stack-page-meta">
              <span id="stack-member-count" class="stack-page-count"></span>
              <button
                id="stack-search-btn"
                class="stack-page-search-btn"
                onclick="searchStack()"
                title="Search all tracked items for new issues"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="11" cy="11" r="8" />
                  <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                Search for Issues
              </button>
            </div>
          </div>
          <div class="sort-controls">
            <label for="stack-sort-select">Sort:</label>
            <select
              id="stack-sort-select"
              onchange="setStackSort(this.value)"
              aria-label="Sort stack members by"
            >
              <option value="title">Title</option>
              <option value="category">Category</option>
              <option value="library_count">Number of Issues</option>
              <option value="latest_issue">Latest Issue</option>
            </select>
            <button
              id="stack-sort-toggle"
              class="sort-toggle-btn"
              onclick="toggleStackSortOrder()"
              aria-label="Toggle sort order"
              title="Toggle ascending/descending"
            >
              ↑
            </button>
          </div>
        </div>
      </div>

      <!-- Search progress panel (hidden by default) -->
      <div id="stack-search-panel" class="stack-search-panel hidden">
        <div class="stack-search-panel-header">
          <h3 id="stack-search-title">Searching...</h3>
          <button onclick="closeSearchPanel()" class="stack-search-close" title="Close">
            &times;
          </button>
        </div>
        <div id="stack-search-progress" class="stack-search-progress"></div>
        <div id="stack-search-summary" class="stack-search-summary hidden"></div>
      </div>

      <div id="stack-periodicals-grid" class="periodical-grid"></div>
      <div id="stack-empty-state" class="hidden">
        <div class="empty-state">
          <div class="empty-state-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="48"
              height="48"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
            </svg>
          </div>
          <h3>No Items in This Stack</h3>
          <p>Add periodicals to this stack from the Stacks management tab.</p>
          <button onclick="goBack()" class="btn-primary" style="margin-top: 16px">
            ← Back to Library
          </button>
        </div>
      </div>
    </div>

    <script type="module">
      import { initStackDetail } from '/static/js/features/stacks-detail.js';
      initStackDetail();
    </script>
  </body>
</html>
