<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comic Reader - Curator</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪙</text></svg>"
    />
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/themes.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          sans-serif;
        background: var(--background);
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      /* Header */
      .reader-header {
        background: var(--surface);
        border-bottom: 1px solid var(--border-color);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .reader-title {
        font-size: 1.1em;
        font-weight: 600;
        margin: 0;
        color: var(--text-primary);
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .header-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .btn {
        padding: 8px 16px;
        background: var(--primary-color);
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9em;
        transition: opacity 0.2s;
      }

      .btn:hover {
        opacity: 0.85;
      }

      .btn-secondary {
        background: var(--surface-variant);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
      }

      /* Main Layout */
      .reader-container {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* Sidebar */
      .sidebar {
        width: 200px;
        background: var(--surface);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }

      .sidebar-header {
        padding: 15px;
        border-bottom: 1px solid var(--border-color);
        font-weight: 600;
        color: var(--text-secondary);
        font-size: 0.85em;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .page-list {
        overflow-y: auto;
        flex: 1;
        padding: 8px;
      }

      .page-item {
        cursor: pointer;
        border: 2px solid transparent;
        border-radius: 4px;
        transition: all 0.2s;
        margin-bottom: 8px;
        position: relative;
        overflow: hidden;
      }

      .page-item:hover {
        border-color: var(--primary-color);
      }

      .page-item.active {
        border-color: var(--primary-color);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }

      .page-thumbnail {
        width: 100%;
        height: auto;
        display: block;
        background: var(--surface-variant);
      }

      .page-number {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 4px 8px;
        font-size: 0.75em;
        text-align: center;
      }

      .page-item.active .page-number {
        background: var(--primary-color);
      }

      /* Content Area */
      .content-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .content-header {
        background: var(--surface-variant);
        padding: 12px 20px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        gap: 15px;
        flex-wrap: wrap;
      }

      .page-title-display {
        font-weight: 500;
        color: var(--text-primary);
        font-size: 1em;
      }

      .fit-controls {
        display: flex;
        gap: 5px;
        align-items: center;
      }

      .fit-controls-label {
        font-size: 0.85em;
        color: var(--text-secondary);
        margin-right: 5px;
      }

      .fit-btn {
        padding: 4px 10px;
        background: var(--background);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8em;
        transition: all 0.2s;
      }

      .fit-btn:hover {
        background: var(--surface);
      }

      .fit-btn.active {
        background: var(--primary-color);
        color: white;
        border-color: var(--primary-color);
      }

      .nav-buttons {
        display: flex;
        gap: 8px;
      }

      .nav-btn {
        padding: 6px 12px;
        background: var(--background);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9em;
        transition: background 0.2s;
      }

      .nav-btn:hover:not(:disabled) {
        background: var(--surface);
      }

      .nav-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .page-content {
        flex: 1;
        overflow-y: auto;
        background: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .page-image-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .page-image {
        display: block;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      /* Fit modes */
      .page-image-container.fit-width .page-image {
        width: 100%;
        height: auto;
        max-height: none;
      }

      .page-image-container.fit-height .page-image {
        height: 100%;
        width: auto;
        max-width: none;
      }

      .page-image-container.original .page-image {
        max-width: none;
        max-height: none;
      }

      /* Zoom and View controls */
      .zoom-controls,
      .view-controls {
        display: flex;
        gap: 5px;
        align-items: center;
      }

      /* Two-page spread mode */
      .page-spread-container {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        padding: 20px;
        height: 100%;
        width: 100%;
        overflow: auto;
      }

      .spread-image {
        max-height: 100%;
        max-width: 50%;
        object-fit: contain;
      }

      /* Fit modes for spread - use transform scale for zoom compatibility */
      .page-spread-container.fit-width {
        align-items: flex-start;
        overflow-x: auto;
      }

      .page-spread-container.fit-width .spread-image {
        max-width: 50%;
        height: auto;
        max-height: none;
      }

      .page-spread-container.fit-height .spread-image {
        height: 100%;
        width: auto;
        max-width: none;
      }

      .page-spread-container.original .spread-image {
        max-width: none;
        max-height: none;
        width: auto;
        height: auto;
      }

      /* Loading State */
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-secondary);
        font-size: 1.1em;
      }

      .spinner {
        border: 3px solid var(--border-color);
        border-top-color: var(--primary-color);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin-bottom: 15px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Error State */
      .error {
        color: var(--error-color);
        padding: 20px;
        text-align: center;
      }

      /* Mobile Responsive */
      @media (max-width: 768px) {
        .sidebar {
          position: fixed;
          left: -200px;
          height: 100%;
          z-index: 100;
          transition: left 0.3s;
        }

        .sidebar.open {
          left: 0;
        }

        .reader-header {
          flex-direction: column;
          align-items: stretch;
          gap: 10px;
          padding: 10px 15px;
        }

        .reader-title {
          font-size: 0.95em;
          text-align: center;
          white-space: normal;
          line-height: 1.3;
        }

        .header-actions {
          width: 100%;
          justify-content: center;
        }

        .header-actions .btn {
          width: 100%;
          padding: 10px 16px;
          font-size: 0.95em;
        }

        .content-header {
          flex-wrap: wrap;
          padding: 8px 10px;
          gap: 6px;
          position: relative;
        }

        .page-title-display {
          width: 100%;
          font-size: 0.85em;
          text-align: center;
          margin-bottom: 4px;
        }

        .fit-controls {
          order: 2;
          width: 100%;
          justify-content: center;
          gap: 4px;
        }

        .zoom-controls {
          order: 1;
          flex: 1;
          justify-content: center;
          gap: 4px;
        }

        .view-controls {
          order: 2;
          display: flex;
          flex-direction: column;
          gap: 4px;
          flex-shrink: 0;
          position: absolute;
          right: 10px;
          bottom: 44px;
        }

        .fit-controls-label {
          font-size: 0.75em;
        }

        .fit-btn {
          padding: 6px 8px;
          font-size: 0.75em;
        }

        .nav-buttons {
          order: 3;
          width: 100%;
          justify-content: space-between;
          margin-top: 4px;
        }

        .nav-btn {
          flex: 1;
          padding: 8px 12px;
          font-size: 0.85em;
        }

        .page-content {
          padding: 5px;
        }

        .page-image-container {
          padding: 5px;
        }

        .page-spread-container {
          padding: 5px;
          gap: 5px;
        }

        .mobile-overlay {
          display: none;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: rgba(0, 0, 0, 0.5);
          z-index: 99;
        }

        .mobile-overlay.active {
          display: block;
        }
      }

      /* Landscape mobile optimization */
      @media (max-width: 926px) and (max-height: 428px) and (orientation: landscape) {
        .reader-header {
          padding: 6px 12px;
          gap: 6px;
        }

        .reader-title {
          font-size: 0.85em;
          line-height: 1.2;
        }

        .header-actions .btn {
          padding: 6px 12px;
          font-size: 0.85em;
        }

        .content-header {
          padding: 4px 8px;
          gap: 4px;
        }

        .page-title-display {
          font-size: 0.8em;
          margin-bottom: 2px;
        }

        .fit-btn {
          padding: 4px 6px;
          font-size: 0.7em;
        }

        .fit-controls-label {
          font-size: 0.7em;
        }

        .nav-buttons {
          margin-top: 2px;
        }

        .nav-btn {
          padding: 6px 10px;
          font-size: 0.8em;
        }

        .view-controls {
          bottom: 38px;
        }

        .page-content {
          padding: 2px;
        }

        .page-image-container,
        .page-spread-container {
          padding: 2px;
        }
      }
    </style>
    <script type="module" src="/static/js/comic-reader.js?v=1768783400"></script>
  </head>
  <body>
    <!-- Header -->
    <div class="reader-header">
      <h1 class="reader-title" id="comic-title">Loading...</h1>
      <div class="header-actions">
        <button class="btn" onclick="window.location.href = '/'">← Back to Library</button>
      </div>
    </div>

    <!-- Main Container -->
    <div class="reader-container">
      <!-- Sidebar -->
      <div class="sidebar" id="sidebar">
        <div class="sidebar-header">Pages</div>
        <div class="page-list" id="page-list">
          <div class="loading">
            <div style="text-align: center">
              <div class="spinner"></div>
              <div>Loading pages...</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Content Area -->
      <div class="content-area">
        <div class="content-header">
          <div class="page-title-display" id="current-page-title">Select a page</div>
          <div class="fit-controls">
            <span class="fit-controls-label">Fit:</span>
            <button
              class="fit-btn active"
              data-mode="fit-width"
              onclick="comicReader.setFitMode('fit-width')"
            >
              Width
            </button>
            <button
              class="fit-btn"
              data-mode="fit-height"
              onclick="comicReader.setFitMode('fit-height')"
            >
              Height
            </button>
            <button
              class="fit-btn"
              data-mode="original"
              onclick="comicReader.setFitMode('original')"
            >
              Original
            </button>
          </div>
          <div class="zoom-controls">
            <span class="fit-controls-label">Zoom:</span>
            <button class="fit-btn" onclick="comicReader.adjustZoom(-10)" title="Zoom out (-)">
              −
            </button>
            <span id="zoom-level" style="min-width: 45px; text-align: center; font-weight: 500">
              100%
            </span>
            <button class="fit-btn" onclick="comicReader.adjustZoom(10)" title="Zoom in (+)">
              +
            </button>
            <button class="fit-btn" onclick="comicReader.resetZoom()" title="Reset zoom (0)">
              Reset
            </button>
          </div>
          <div class="view-controls">
            <button
              class="fit-btn"
              id="spread-btn"
              onclick="comicReader.toggleSpreadMode()"
              title="Two-page spread mode (S)"
            >
              📄
            </button>
            <button
              class="fit-btn"
              id="fullscreen-btn"
              onclick="comicReader.toggleFullscreen()"
              title="Fullscreen (F)"
            >
              ⛶
            </button>
          </div>
          <div class="nav-buttons">
            <button class="nav-btn" id="prev-btn" onclick="comicReader.previousPage()">
              ← Previous
            </button>
            <button class="nav-btn" id="next-btn" onclick="comicReader.nextPage()">Next →</button>
          </div>
        </div>
        <div class="page-content" id="page-content">
          <div class="loading">
            <div style="text-align: center">
              <div class="spinner"></div>
              <div>Loading content...</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile Overlay -->
    <div class="mobile-overlay" id="mobile-overlay" onclick="toggleSidebar()"></div>
  </body>
</html>
