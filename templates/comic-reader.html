<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Comic Reader - Curator</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%237b68ee%22 stroke-width=%221.75%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z%22/><path d=%22M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z%22/></svg>"
    />
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/themes.css" />
    <link rel="stylesheet" href="/static/css/reader.css" />
    <script type="module" src="/static/js/readers/comic-reader.js?v=1769024098"></script>
  </head>
  <body>
    <!-- Header -->
    <div class="reader-header">
      <h1 class="reader-title" id="comic-title">Loading...</h1>
      <div class="header-actions">
        <button class="nav-btn" id="header-prev-btn" onclick="comicReader.previousPage()">←</button>
        <button class="btn" id="back-btn" onclick="comicReader.goBackToPeriodical()">
          ← Back to Periodical
        </button>
        <button class="nav-btn" id="header-next-btn" onclick="comicReader.nextPage()">→</button>
      </div>
    </div>

    <!-- Main Container -->
    <div class="reader-container">
      <!-- Sidebar -->
      <div class="sidebar" id="sidebar">
        <div class="sidebar-header">Pages</div>
        <div class="page-list" id="page-list">
          <div class="loading">
            <div style="text-align: center">
              <div class="spinner"></div>
              <div>Loading pages...</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Content Area -->
      <div class="content-area">
        <div class="content-header">
          <div class="page-title-display" id="current-page-title">Select a page</div>
          <div class="fit-controls">
            <span class="fit-controls-label">Fit:</span>
            <button
              class="fit-btn"
              data-mode="fit-width"
              onclick="comicReader.setFitMode('fit-width')"
            >
              <span class="btn-icon" aria-hidden="true">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M8 9l-4 3 4 3" />
                  <path d="M16 9l4 3-4 3" />
                  <line x1="4" y1="12" x2="20" y2="12" />
                  <line x1="4" y1="5" x2="4" y2="19" />
                  <line x1="20" y1="5" x2="20" y2="19" />
                </svg>
              </span>
              <span class="btn-text">Width</span>
            </button>
            <button
              class="fit-btn active"
              data-mode="fit-height"
              onclick="comicReader.setFitMode('fit-height')"
            >
              <span class="btn-icon" aria-hidden="true">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M9 8l3-4 3 4" />
                  <path d="M9 16l3 4 3-4" />
                  <line x1="12" y1="4" x2="12" y2="20" />
                  <line x1="5" y1="4" x2="19" y2="4" />
                  <line x1="5" y1="20" x2="19" y2="20" />
                </svg>
              </span>
              <span class="btn-text">Height</span>
            </button>
            <button
              class="fit-btn"
              data-mode="original"
              onclick="comicReader.setFitMode('original')"
            >
              <span class="btn-icon" aria-hidden="true">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="11" cy="11" r="8" />
                  <path d="m21 21-4.35-4.35" />
                </svg>
              </span>
              <span class="btn-text">Original</span>
            </button>
          </div>
          <div class="zoom-controls">
            <span class="fit-controls-label">Zoom:</span>
            <button class="fit-btn" onclick="comicReader.adjustZoom(-10)" title="Zoom out (-)">
              −
            </button>
            <span id="zoom-level" style="min-width: 45px; text-align: center; font-weight: 500">
              100%
            </span>
            <button class="fit-btn" onclick="comicReader.adjustZoom(10)" title="Zoom in (+)">
              +
            </button>
            <button class="fit-btn" onclick="comicReader.resetZoom()" title="Reset zoom (0)">
              Reset
            </button>
          </div>
          <div class="view-controls">
            <button
              class="fit-btn"
              id="spread-btn"
              onclick="comicReader.toggleSpreadMode()"
              title="Two-page spread mode (S)"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
              </svg>
            </button>
            <button
              class="fit-btn"
              id="fullscreen-btn"
              onclick="comicReader.toggleFullscreen()"
              title="Fullscreen (F)"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"
                />
              </svg>
            </button>
          </div>
          <div class="nav-buttons">
            <button class="nav-btn" id="prev-btn" onclick="comicReader.previousPage()">
              ← Previous
            </button>
            <button class="nav-btn" id="next-btn" onclick="comicReader.nextPage()">Next →</button>
          </div>
        </div>
        <div class="page-content" id="page-content">
          <div class="loading">
            <div style="text-align: center">
              <div class="spinner"></div>
              <div>Loading content...</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile Overlay -->
    <div class="mobile-overlay" id="mobile-overlay" onclick="toggleSidebar()"></div>
  </body>
</html>
