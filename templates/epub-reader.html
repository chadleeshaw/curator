<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EPUB Reader - Curator</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪙</text></svg>"
    />
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/themes.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          sans-serif;
        background: var(--background);
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      /* Header */
      .reader-header {
        background: var(--surface);
        border-bottom: 1px solid var(--border-color);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .reader-title {
        font-size: 1.1em;
        font-weight: 600;
        margin: 0;
        color: var(--text-primary);
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .header-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .btn {
        padding: 8px 16px;
        background: var(--primary-color);
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9em;
        transition: opacity 0.2s;
      }

      .btn:hover {
        opacity: 0.85;
      }

      .btn-secondary {
        background: var(--surface-variant);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
      }

      /* Main Layout */
      .reader-container {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* Sidebar */
      .sidebar {
        width: 280px;
        background: var(--surface);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }

      .sidebar-header {
        padding: 15px;
        border-bottom: 1px solid var(--border-color);
        font-weight: 600;
        color: var(--text-secondary);
        font-size: 0.85em;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .chapter-list {
        overflow-y: auto;
        flex: 1;
      }

      .chapter-item {
        padding: 12px 15px;
        cursor: pointer;
        border-bottom: 1px solid var(--border-color);
        transition: background 0.2s;
        color: var(--text-primary);
        font-size: 0.95em;
      }

      .chapter-item:hover {
        background: var(--surface-variant);
      }

      .chapter-item.active {
        background: var(--primary-color);
        color: white;
        font-weight: 500;
      }

      .chapter-number {
        color: var(--text-secondary);
        font-size: 0.85em;
        margin-right: 8px;
      }

      .chapter-item.active .chapter-number {
        color: rgba(255, 255, 255, 0.8);
      }

      /* Content Area */
      .content-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .content-header {
        background: var(--surface-variant);
        padding: 12px 20px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .chapter-title-display {
        font-weight: 500;
        color: var(--text-primary);
        font-size: 1em;
      }

      .nav-buttons {
        display: flex;
        gap: 8px;
      }

      .nav-btn {
        padding: 6px 12px;
        background: var(--background);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9em;
        transition: background 0.2s;
      }

      .nav-btn:hover:not(:disabled) {
        background: var(--surface);
      }

      .nav-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .chapter-content {
        flex: 1;
        overflow-y: auto;
        padding: 40px;
        background: var(--background);
      }

      .chapter-content-inner {
        max-width: 800px;
        margin: 0 auto;
        line-height: 1.8;
        font-size: 1.05em;
      }

      /* Loading State */
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-secondary);
        font-size: 1.1em;
      }

      .spinner {
        border: 3px solid var(--border-color);
        border-top-color: var(--primary-color);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin-bottom: 15px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Error State */
      .error {
        color: var(--error-color);
        padding: 20px;
        text-align: center;
      }

      /* Mobile Responsive */
      @media (max-width: 768px) {
        .sidebar {
          position: fixed;
          left: -280px;
          height: 100%;
          z-index: 100;
          transition: left 0.3s;
        }

        .sidebar.open {
          left: 0;
        }

        .chapter-content {
          padding: 20px;
        }

        .mobile-overlay {
          display: none;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: rgba(0, 0, 0, 0.5);
          z-index: 99;
        }

        .mobile-overlay.active {
          display: block;
        }
      }

      /* Chapter content styling */
      .chapter-content-inner h1,
      .chapter-content-inner h2,
      .chapter-content-inner h3 {
        margin-top: 1.5em;
        margin-bottom: 0.5em;
        color: var(--text-primary);
      }

      .chapter-content-inner p {
        margin-bottom: 1em;
        text-align: left !important; /* Override EPUB centering */
      }

      .chapter-content-inner img {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 1.5em auto;
      }

      .chapter-content-inner table {
        text-align: left !important; /* Override EPUB table centering */
        margin-left: 0 !important;
        margin-right: auto !important;
      }

      .chapter-content-inner td {
        text-align: left !important;
      }

      /* Disable internal EPUB links to prevent 404 errors */
      .chapter-content-inner a {
        color: var(--text-primary);
        text-decoration: none;
        pointer-events: none;
        cursor: text;
      }
    </style>
    <script type="module" src="/static/js/epub-reader.js"></script>
  </head>
  <body>
    <!-- Header -->
    <div class="reader-header">
      <h1 class="reader-title" id="book-title">Loading...</h1>
      <div class="header-actions">
        <button class="btn" onclick="window.location.href = '/'">← Back to Library</button>
      </div>
    </div>

    <!-- Main Container -->
    <div class="reader-container">
      <!-- Sidebar -->
      <div class="sidebar" id="sidebar">
        <div class="sidebar-header">Table of Contents</div>
        <div class="chapter-list" id="chapter-list">
          <div class="loading">
            <div style="text-align: center">
              <div class="spinner"></div>
              <div>Loading chapters...</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Content Area -->
      <div class="content-area">
        <div class="content-header">
          <div class="chapter-title-display" id="current-chapter-title">Select a chapter</div>
          <div class="nav-buttons">
            <button class="nav-btn" id="prev-btn" onclick="epubReader.previousChapter()">
              ← Previous
            </button>
            <button class="nav-btn" id="next-btn" onclick="epubReader.nextChapter()">Next →</button>
          </div>
        </div>
        <div class="chapter-content" id="chapter-content">
          <div class="loading">
            <div style="text-align: center">
              <div class="spinner"></div>
              <div>Loading content...</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile Overlay -->
    <div class="mobile-overlay" id="mobile-overlay" onclick="toggleSidebar()"></div>
  </body>
</html>
